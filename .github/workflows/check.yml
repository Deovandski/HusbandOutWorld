name: Check website build

# Runs the website build on every pull request (text only, no images) so a
# broken build shows up before merging instead of after.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/build.py --out _site --no-images
      # how much is translated, per language (information only; never fails the check)
      - run: python tools/i18n.py status || true
