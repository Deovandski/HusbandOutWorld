name: Website

# Builds the website from the Legacy folder (tools/build.py) and publishes it to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Custom domain: add it under Settings > Pages, then commit a CNAME file at the repo root.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The build never reads the art programs' source files (.xcf, .clip, .tif: about
      # 2.3 GB of the repo), so the runner doesn't download them. They stay in the repo.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.xcf
            !*.clip
            !*.tif

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install -r tools/requirements.txt
          sudo apt-get install -y --no-install-recommends ffmpeg || true

      # Web-sized images take a while to make, so keep them between runs.
      - uses: actions/cache@v6
        with:
          path: .media-cache
          key: media-${{ github.run_id }}
          restore-keys: media-

      # Tells the build where the site lives: /HusbandOutWorld on github.io,
      # or the root once a custom domain is set in Settings > Pages.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        run: >
          python tools/build.py --out _site --cache .media-cache
          --base-path "${{ steps.pages.outputs.base_path }}"
          --site-url "${{ steps.pages.outputs.base_url }}"

      # Every picture on every page is in the build, and the site fits in Pages' 1 GB.
      # The sizes show on the run's summary page.
      - name: Check pictures and size
        run: >
          python tools/check_site.py _site
          --base-path "${{ steps.pages.outputs.base_path }}"
          --summary "$GITHUB_STEP_SUMMARY"

      # Each attempt uploads its own package, so "Re-run" never finds two with the same name.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
          include-hidden-files: true  # keep .nojekyll, as before

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
